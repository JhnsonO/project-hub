name: Validate project dashboard

on:
  pull_request:
    paths:
      - 'data/projects.json'
      - 'scripts/validate-projects.mjs'
      - '.github/workflows/validate-project-directory.yml'
  push:
    paths:
      - 'data/projects.json'
      - 'scripts/validate-projects.mjs'
      - '.github/workflows/validate-project-directory.yml'

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-projects.mjs
