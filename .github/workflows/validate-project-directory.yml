name: Validate project dashboard

on:
  pull_request:
    paths:
      - 'data/projects.json'
      - 'app.js'
      - 'package.json'
      - 'model.mjs'
      - 'road.mjs'
      - 'road.js'
      - 'road.css'
      - 'road.html'
      - 'scripts/test-road.mjs'
      - 'dashboard.css'
      - 'index.html'
      - 'scripts/validate-projects.mjs'
      - 'scripts/test-model.mjs'
      - '.github/workflows/validate-project-directory.yml'
  push:
    paths:
      - 'data/projects.json'
      - 'app.js'
      - 'package.json'
      - 'model.mjs'
      - 'road.mjs'
      - 'road.js'
      - 'road.css'
      - 'road.html'
      - 'scripts/test-road.mjs'
      - 'dashboard.css'
      - 'index.html'
      - 'scripts/validate-projects.mjs'
      - 'scripts/test-model.mjs'
      - '.github/workflows/validate-project-directory.yml'

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: node scripts/validate-projects.mjs
      - run: node scripts/test-model.mjs
      - run: node --check road.js
      - run: node scripts/test-road.mjs
