<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="A single entry point for Johnson's private project workspaces.">
  <title>Project Hub — Johnson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,500;1,500&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell" data-theme="dark">
    <a class="skip-link" href="#main">Skip to projects</a>
    <aside class="sidebar" aria-label="Project navigation">
      <a class="brand" href="./" aria-label="Johnson's project hub home"><span class="brand-mark">J</span><span>PROJECT HUB</span></a>
      <nav id="group-nav" class="group-nav" aria-label="Filter projects"></nav>
      <div class="side-rule"></div>
      <div class="access-key"><span class="access-lock" aria-hidden="true">▣</span><span>PRIVATE</span></div>
      <div class="side-spacer"></div>
    </aside>

    <main id="main" class="main-content">
      <header class="topbar">
        <fieldset class="theme-switch" aria-label="Display mode">
          <legend class="sr-only">Display mode</legend>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="true">Dark HUD</button>
          <button type="button" data-theme-choice="char" aria-pressed="false">Charcoal</button>
        </fieldset>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">Your projects<span class="title-mark">.</span></h1>
      </section>

      <a id="pick-up" class="pick-up" href="#projects" hidden>
        <span><small>PICK UP HERE <i aria-hidden="true">·</i> OEV</small><strong id="pick-up-title">OEV Broadcast</strong></span>
        <span class="pick-arrow">OPEN <span aria-hidden="true">↗</span></span>
      </a>

      <section class="directory" aria-labelledby="directory-title">
        <div class="section-heading"><h2 id="directory-title">Projects</h2><div id="project-count" class="item-count" aria-live="polite"></div></div>
        <div class="filter-row">
          <label class="search-box"><span aria-hidden="true">⌕</span><span class="sr-only">Search projects</span><input id="project-search" type="search" placeholder="Search" autocomplete="off"></label>
          <div id="mobile-group-nav" class="mobile-group-nav" aria-label="Filter by group"></div>
        </div>
        <div id="projects" class="project-groups"><p class="loading">Loading project directory…</p></div>
      </section>
    </main>
  </div>
</body>
</html>
